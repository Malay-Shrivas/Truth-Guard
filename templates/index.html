<!DOCTYPE html>
<html>
<head>
    <title>Fake News Headline Detector</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        textarea { width: 100%; height: 120px; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 24px; background: #007AFF; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: #ff3b30; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>📰 Fake News Headline Detector</h1>
    <p>Enter a news headline to check if it’s likely <strong>Real</strong> or <strong>Fake</strong>.</p>
    
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    
    <form method="POST" action="/predict">
        <textarea name="headline" placeholder="e.g., 'Scientists reverse aging in mice'"></textarea><br>
        <button type="submit">Analyze Headline</button>
    </form>
</body>
</html>
